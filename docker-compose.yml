version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: locatemeai-backend
    ports:
      - "8000:8000"
    volumes:
      # Temporary uploads and outputs
      - ./backend/uploads:/app/uploads
      - ./backend/outputs:/app/outputs
      # Training runs and results (persistent)
      - ./backend/runs:/app/runs
      # Persistent storage for fine-tuned models
      - backend-models:/app/models
      # Persistent storage for active model configuration
      - backend-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    env_file:
      - ./backend/.env
    networks:
      - locatemeai-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: locatemeai-frontend
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1 
    env_file:
      - ./frontend/.env
    networks:
      - locatemeai-network
    depends_on:
      - backend
    restart: unless-stopped

  # Optional: Ollama service (if you want to include it in Docker)
  # Uncomment if you want Ollama running in a container
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: locatemeai-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama-data:/root/.ollama
  #   networks:
  #     - locatemeai-network
  #   restart: unless-stopped

networks:
  locatemeai-network:
    driver: bridge

volumes:
  ollama-data:
  # Persistent volume for fine-tuned YOLO models
  backend-models:
    driver: local
  # Persistent volume for active model configuration and training data
  backend-data:
    driver: local
